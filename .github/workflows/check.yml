name: Checks

# The fast checks (tools/check), one job per step so a failure names its step: the CPU CMake preset and the Python suites.
# No GPU, no model and no download of weights.  The config snapshot has its own workflow (snapshot.yml)
# and the backend compile checks theirs (backends.yml).  Run the same thing by hand:  python tools/check --only <step>

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - bench/micro/**
      - third_party/**
      - tests/**
      - serve/**
      - strata.py
      - setup.py
      - strata_cli/**
      - strata_control/**
      - tools/**
      - packaging/**
  pull_request:
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - bench/micro/**
      - third_party/**
      - tests/**
      - serve/**
      - strata.py
      - setup.py
      - strata_cli/**
      - strata_control/**
      - tools/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu CMake preset, only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python serve/, only: py-serve }
          - { name: Python tools/, only: py-tools }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      - name: tools/check
        run: python tools/check --only "${{ matrix.only }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  windows:
    name: Windows / ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu CMake preset (MSVC), only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python serve/, only: py-serve }
          - { name: Python tools/, only: py-tools }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      # tools/check finds Visual Studio's compiler itself (vcvars64.bat); bash is Git for Windows'
      - name: tools/check
        run: python tools/check --only "${{ matrix.only }}" --keep --scratch "$env:RUNNER_TEMP\check" --json "$env:RUNNER_TEMP\check\result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}\check\*.log
            ${{ runner.temp }}\check\result.json
          retention-days: 7
